{% extends 'base.html' %}
{% block title %}Manage Blog - Kyle Hampton{% endblock %}
{% block content %}<section class="admin-page"><div class="admin-heading"><h1>Manage Blog</h1><a class="project-button" href="{{ url_for('admin_post_new') }}">New post</a><form method="post" action="{{ url_for('admin_logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="project-button" type="submit">Log out</button></form></div>{% for post in posts %}<div class="admin-row"><div><small>{{ 'Published' if post.published else 'Draft' }}</small><h2>{{ post.title }}</h2></div><a class="project-button" href="{{ url_for('admin_post_edit', post_id=post.id) }}">Edit</a><form method="post" action="{{ url_for('admin_post_delete', post_id=post.id) }}" onsubmit="return confirm('Delete this post?')"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="project-button danger" type="submit">Delete</button></form></div>{% else %}<p>No posts yet.</p>{% endfor %}</section>{% endblock %}
