{% extends 'base.html' %}{% block title %}Manage Blog | Kyle Hampton{% endblock %}{% block content %}<section class="section shell"><div class="admin-heading"><div><p class="eyebrow">Private area</p><h1>Manage blog</h1></div><div class="button-row"><a class="button primary" href="{{ url_for('admin_post_new') }}">New post</a><form method="post" action="{{ url_for('admin_logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="button secondary" type="submit">Log out</button></form></div></div><div class="admin-list">{% for post in posts %}<div class="card admin-row"><div><span class="tag">{{ 'Published' if post.published else 'Draft' }}</span><h2>{{ post.title }}</h2></div><div class="button-row"><a class="button secondary" href="{{ url_for('admin_post_edit', post_id=post.id) }}">Edit</a><form method="post" action="{{ url_for('admin_post_delete', post_id=post.id) }}" onsubmit="return confirm('Delete this post?')"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="button danger" type="submit">Delete</button></form></div></div>{% else %}<p>No posts yet.</p>{% endfor %}</div></section>{% endblock %}
