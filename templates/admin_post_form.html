{% extends 'base.html' %}
{% block title %}{{ 'Edit' if post else 'New' }} Post - Kyle Hampton{% endblock %}
{% block content %}<section class="admin-page"><form class="admin-form" method="post"><h1>{{ 'Edit post' if post else 'Write a post' }}</h1><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Title<input name="title" required value="{{ post.title if post else '' }}"></label><label>URL slug<input name="slug" value="{{ post.slug if post else '' }}"></label><label>Short summary<textarea name="excerpt" rows="3" required>{{ post.excerpt if post else '' }}</textarea></label><label>Post<textarea name="body" rows="18" required>{{ post.body if post else '' }}</textarea></label><label class="checkbox"><input type="checkbox" name="published" {% if not post or post.published %}checked{% endif %}> Publish now</label><button class="project-button" type="submit">Save post</button><a class="project-button" href="{{ url_for('admin_posts') }}">Cancel</a></form></section>{% endblock %}
